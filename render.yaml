# Blueprint for API + worker on Render.
# Root Directory must be the repo root (not apps/api).
# Dashboard alternative: set Build/Start commands below per service.

services:
  - type: web
    name: munshi-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CASE_EVENT_FANOUT_SECRET
        sync: false
      - key: DESK_ID
        sync: false
      - key: DESK_PASSWORD
        sync: false
      - key: SARVAM_API_KEY
        sync: false

  - type: worker
    name: munshi-worker
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build:worker
    startCommand: npm run start:worker
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CASE_EVENT_FANOUT_URL
        sync: false
      - key: CASE_EVENT_FANOUT_SECRET
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
